# Free GitHub-hosted build for the public Muyassir Android repo.
name: Android

on:
  push:
    branches-ignore: [ci-shots]
    paths-ignore: ['**.md', 'docs/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v6
        with: { gradle-version: '9.9.1' }
      - name: Version code
        run: echo "MYS_VERSION_CODE=$(( $(date -u +%s) / 60 ))" >> "$GITHUB_ENV"
      - name: Signing key (only if the repository secrets exist)
        env: { KS_B64: '${{ secrets.MYS_KS_B64 }}' }
        run: |
          if [ -n "$KS_B64" ]; then echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"; echo "MYS_KS=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"; fi
      - name: Unit tests (calculations, OOXML writers/readers, expressions, text tools)
        run: gradle --no-daemon testDebugUnitTest
      - name: Lint (no API newer than minSdk)
        run: gradle --no-daemon lintDebug
      - name: Build bundle and APKs
        env: { MYS_KS_PASS: '${{ secrets.MYS_KS_PASS }}' }
        run: |
          gradle --no-daemon bundleRelease
          gradle --no-daemon -PabiSplits assembleRelease assembleDebug assembleDebugAndroidTest
      - name: Add v1 (JAR) signature and verify (some phones refuse APKs without it)
        env: { MYS_KS_PASS: '${{ secrets.MYS_KS_PASS }}' }
        run: |
          SIGNER=$(ls -d $ANDROID_HOME/build-tools/*/ | sort -V | tail -1)apksigner
          if [ -n "$MYS_KS_PASS" ]; then KS="$MYS_KS"; ALIAS=upload; PASS="$MYS_KS_PASS"; else KS=app/preview.jks; ALIAS=preview; PASS=muyassir-preview; fi
          for a in app/build/outputs/apk/release/*.apk; do
            $SIGNER sign --ks "$KS" --ks-key-alias $ALIAS --ks-pass pass:$PASS --key-pass pass:$PASS --min-sdk-version 16 --v1-signing-enabled true --v2-signing-enabled true "$a"
            $SIGNER verify --verbose --min-sdk-version 16 "$a" 2>/dev/null | tee /tmp/sig.txt; unzip -l "$a" | grep -E "META-INF/[^/]+\.(SF|RSA)$"
            grep -q "v1 scheme (JAR signing): true" /tmp/sig.txt; grep -q "v2 scheme (APK Signature Scheme v2): true" /tmp/sig.txt
          done
      - uses: actions/upload-artifact@v7
        with:
          name: muyassir-android-${{ github.run_number }}
          path: |
            app/build/outputs/bundle/release/*.aab
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/androidTest/debug/*.apk
          retention-days: 14
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: unit-test-report-${{ github.run_number }}
          path: app/build/reports/tests/
          retention-days: 7
          if-no-files-found: ignore

  device:
    # Real engines on an emulator (PDF, Office, OCR, images, ZIP, Hijri) + every tool screen opened and photographed.
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with: { name: 'muyassir-android-${{ github.run_number }}', path: out }
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Emulator (Pixel 6, Android 14)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis_playstore
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash tools/device-test.sh
      - name: Publish screenshots and reports to the ci-shots branch
        if: always()
        run: |
          test -d shots || exit 0
          cd shots && git init -q && git checkout -q -b ci-shots
          git config user.name "github-actions" && git config user.email "actions@github.com"
          git add -A && git commit -q -m "screens from run ${{ github.run_number }} (${{ github.sha }})"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-shots

  launch-matrix:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        api: [26, 30, 35]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with: { name: 'muyassir-android-${{ github.run_number }}', path: out }
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Launch the minified release build on API ${{ matrix.api }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: ${{ matrix.api >= 30 && 'google_apis' || 'default' }}
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash tools/launch-test.sh

  preview:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with: { name: 'muyassir-android-${{ github.run_number }}', path: out }
      - name: Publish the preview APK
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          cp out/apk/release/*arm64-v8a*.apk muyassir-preview.apk
          cp out/apk/release/*armeabi-v7a*.apk muyassir-preview-32bit.apk
          cp out/apk/release/*universal*.apk muyassir-preview-universal.apk
          cp out/bundle/release/*.aab muyassir-play.aab
          ls -la muyassir-preview*.apk
          gh release delete preview --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag 2>/dev/null || true
          gh release create preview muyassir-preview.apk muyassir-preview-32bit.apk muyassir-preview-universal.apk muyassir-play.aab --repo "$GITHUB_REPOSITORY" --prerelease --target "$GITHUB_SHA" \
            --title "نسخة المعاينة" --notes "آخر نسخة من الفرع الرئيسي بعد نجاح الفحوص ($(date -u +%F))."
